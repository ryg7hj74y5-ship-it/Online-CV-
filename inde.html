<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gage Kopp | CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style id="css">
:root {
  --paper: #F6F2EF; --paper-2: #ECE3DD; --ink: #2A1A12; --muted: #6E5A4E;
  --rule: #D9CCC3; --grid: #E7DDD6; --fbe: #8C1C1C; --fbe-soft: #F1DAD6; --brown: #6B3A1E;
  --flag: #B4541A; --tbd-bg: #F6E3D2;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1B1411; --paper-2: #261C17; --ink: #F1E7E0; --muted: #B5A398;
    --rule: #3E2F27; --grid: #2A201A; --fbe: #E0766A; --fbe-soft: #3E211D; --brown: #D9A57A;
    --flag: #E8955A; --tbd-bg: #43291B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1B1411; --paper-2: #261C17; --ink: #F1E7E0; --muted: #B5A398;
    --rule: #3E2F27; --grid: #2A201A; --fbe: #E0766A; --fbe-soft: #3E211D; --brown: #D9A57A;
    --flag: #E8955A; --tbd-bg: #43291B; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4rem); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-size: 1.0625rem; line-height: 1.55;
}
img { max-width: 100%; display: block; }
a { color: var(--fbe); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, label.file:focus-within {
  outline: 3px solid var(--flag); outline-offset: 2px;
}

.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule);
}
.nav-inner { max-width: 72rem; margin: 0 auto; padding: .7rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
.nav-name { font-weight: 750; font-variation-settings: "wdth" 125; text-decoration: none; color: var(--ink); white-space: nowrap; }
.nav ul { display: flex; gap: 1.25rem; list-style: none; margin: 0 0 0 auto; padding: 0; overflow-x: auto; scrollbar-width: none; }
.nav ul::-webkit-scrollbar { display: none; }
.nav ul a { color: var(--muted); text-decoration: none; font-size: .95rem; white-space: nowrap; }
.nav ul a:hover { color: var(--ink); }

.hero {
  max-width: 72rem; margin: 0 auto; padding: 3.5rem 1.5rem 3rem;
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 2.5rem 3.5rem; align-items: start;
}
.hero h1 {
  color: var(--brown); margin: 0; font-size: clamp(3rem, 7.5vw, 6rem); line-height: .95; letter-spacing: -.02em;
  font-weight: 800; font-variation-settings: "wdth" 125;
}
.hero .role { margin: 1rem 0 0; font-size: clamp(1.15rem, 2.2vw, 1.4rem); color: var(--muted); max-width: 32rem; line-height: 1.35; }
.contact-line { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; margin: 1.25rem 0 0; padding: 0; list-style: none; }
.portrait { margin: 2.25rem 0 0; max-width: 28rem; }
.portrait img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 38% 45%; border-radius: 4px; }
.hero-photo { margin: 0; }
.hero-photo img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; border-bottom: 6px solid var(--fbe); }
.hero figcaption { font-size: .85rem; color: var(--muted); margin-top: .5rem; }
.img-empty {
  aspect-ratio: 4 / 3; border: 1px solid var(--rule); border-radius: 4px; color: var(--muted); font-size: .85rem;
  display: grid; place-items: center; text-align: center; padding: 1rem;
  background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 20px 20px,
              linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 20px 20px, var(--paper-2);
}
.hero-photo .img-empty { aspect-ratio: 3 / 4; }

main { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem 4rem; }
section { display: grid; grid-template-columns: 12rem 1fr; gap: 1rem 3rem; padding: 3rem 0; border-top: 1px solid var(--rule); }
section > h2 { color: var(--brown); margin: 0; font-size: 1.35rem; font-weight: 750; font-variation-settings: "wdth" 112; line-height: 1.2; }
.content { max-width: 44rem; min-width: 0; }
.content p { margin: 0 0 1rem; }
.content p:last-child { margin-bottom: 0; }
.entry + .entry { margin-top: 2rem; }
.entry-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .1rem 1rem; align-items: baseline; }
.entry h3 { margin: 0; font-size: 1.15rem; font-weight: 700; }
.entry .when { color: var(--muted); font-size: .95rem; }
.entry .where { margin: .1rem 0 0; color: var(--muted); }
.entry ul { margin: .75rem 0 0; padding-left: 1.1rem; }
.entry li { margin: .35rem 0; }
.entry li::marker { color: var(--fbe); }

.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 2rem 1.75rem; max-width: none; }
.projects figure { margin: 0; }
.projects img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; }
.projects figcaption { margin-top: .7rem; }
.projects .no-photo { border-top: 4px solid var(--fbe); padding-top: .25rem; }
.projects .status { display: inline-block; font-style: normal; font-size: .8rem; font-weight: 600; color: var(--fbe); background: var(--fbe-soft); padding: .1rem .5rem; border-radius: 3px; margin-bottom: .4rem; }
.projects figcaption strong { display: block; font-size: 1.05rem; }
.projects figcaption span { color: var(--muted); font-size: .95rem; display: block; margin-top: .2rem; }

.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1.5rem 2rem; }
.skills h3 { margin: 0 0 .4rem; font-size: 1rem; font-weight: 700; color: var(--fbe); }
.skills p { margin: 0; }

.tbd { background: var(--tbd-bg); border-bottom: 1.5px dashed var(--flag); padding: 0 .2em; border-radius: 2px; }

footer { max-width: 72rem; margin: 0 auto; padding: 2rem 1.5rem 3rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; }

/* editor (owner only) */
.edit-fab {
  position: fixed; right: 1.25rem; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); z-index: 20;
  font: inherit; font-weight: 700; padding: .8rem 1.3rem; border: 0; border-radius: 999px;
  background: var(--fbe); color: #fff; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18);
}
.editor { position: fixed; inset: 0; z-index: 30; background: var(--paper); overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.editor[hidden] { display: none; }
.ed-bar {
  position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--rule);
  padding: calc(.75rem + env(safe-area-inset-top, 0px)) 1.25rem .75rem; display: flex; gap: .75rem; align-items: center;
}
.ed-bar h2 { margin: 0 auto 0 0; font-size: 1.1rem; }
.ed-status { font-size: .9rem; color: var(--muted); }
.ed-status.err { color: var(--flag); }
.ed-body { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }
.ed-body h3 { font-size: 1.25rem; margin: 2.5rem 0 .25rem; font-variation-settings: "wdth" 112; }
.ed-body h3:first-child { margin-top: 0; }
.ed-hint { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
.field { display: block; margin: 0 0 1rem; }
.field > span { display: block; font-size: .9rem; font-weight: 600; margin-bottom: .3rem; }
.field input, .field textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 4px; padding: .55rem .65rem;
}
.field textarea { min-height: 5.5rem; resize: vertical; line-height: 1.45; }
.item { border: 1px solid var(--rule); border-radius: 6px; padding: 1rem 1rem .25rem; margin: 0 0 1rem; background: var(--paper); }
.item-tools { display: flex; gap: .5rem; justify-content: flex-end; margin: -.25rem 0 .75rem; }
.btn {
  font: inherit; font-size: .9rem; padding: .45rem .85rem; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--paper-2); color: var(--ink);
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--fbe); border-color: var(--fbe); color: #fff; font-weight: 700; }
.btn.danger { color: var(--flag); }
.img-field { display: flex; gap: 1rem; align-items: center; margin: 0 0 1rem; flex-wrap: wrap; }
.img-field img, .img-field .thumb-empty { width: 7rem; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; background: var(--paper-2); border: 1px solid var(--rule); }
label.file { position: relative; overflow: hidden; }
label.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

@media (max-width: 48rem) {
  .hero { grid-template-columns: 1fr; padding-top: 2.25rem; }
  .hero-photo img, .hero-photo .img-empty { aspect-ratio: 4 / 5; }
  section { grid-template-columns: 1fr; gap: 1rem; padding: 2.25rem 0; }
  .nav-name { display: none; }
  .nav ul { margin-left: 0; }
}
@media print { .edit-fab, .editor, .nav { display: none !important; } }
</style>
</head>

<script id="app-js">
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("cv-data").textContent);
  var app = document.getElementById("app");
  var DRAFT_KEY = "cv-draft";

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) rich(n, text);
    return n;
  }
  // Text with [bracketed placeholders] highlighted so they're easy to spot.
  function rich(node, str) {
    String(str).split(/(\[[^\]]+\])/).forEach(function (part) {
      if (!part) return;
      if (/^\[[^\]]+\]$/.test(part)) node.appendChild(el("span", "tbd")).textContent = part;
      else node.appendChild(document.createTextNode(part));
    });
    return node;
  }
  function paras(parent, text) {
    String(text || "").split(/\n\s*\n/).forEach(function (p) { if (p.trim()) parent.appendChild(el("p", "", p.trim())); });
  }
  function lines(text) { return String(text || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean); }
  function has(v) { return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim()); }
  function img(src, alt, emptyLabel) {
    if (src) { var i = document.createElement("img"); i.src = src; i.alt = alt || ""; i.loading = "lazy"; return i; }
    return el("div", "img-empty", emptyLabel || "Photo");
  }
  function telHref(p) { var d = String(p || "").replace(/[^\d+]/g, ""); return d ? "tel:" + d : "#contact"; }

  var SECTIONS = [
    ["about", "About"], ["education", "Education"], ["experience", "Work experience"], ["projects", "Projects"],
    ["skills", "Skills"], ["volunteer", "Volunteer experience"], ["memberships", "Memberships"],
    ["interests", "Interests"], ["contact", "Contact"]
  ];
  var NAV = { about: "About", education: "Education", experience: "Experience", projects: "Projects", skills: "Skills", contact: "Contact" };

  function entries(content, list) {
    list.forEach(function (e) {
      var box = content.appendChild(el("div", "entry"));
      var head = box.appendChild(el("div", "entry-head"));
      head.appendChild(el("h3", "", e.title || ""));
      if (has(e.when)) head.appendChild(el("span", "when", e.when));
      if (has(e.org)) box.appendChild(el("p", "where", e.org));
      var b = lines(e.bullets);
      if (b.length) { var ul = box.appendChild(el("ul")); b.forEach(function (t) { ul.appendChild(el("li", "", t)); }); }
    });
  }

  function contactLinks(parent, d, asList) {
    if (has(d.email)) { var a = el("a", "", d.email); a.href = "mailto:" + d.email; (asList ? parent.appendChild(el("li")) : parent).appendChild(a); }
    if (!asList && has(d.email) && has(d.phone)) parent.appendChild(document.createElement("br"));
    if (has(d.phone)) { var t = el("a", "", d.phone); t.href = telHref(d.phone); (asList ? parent.appendChild(el("li")) : parent).appendChild(t); }
  }

  function render(d) {
    app.textContent = "";
    document.title = (d.name || "CV").replace(/\[[^\]]*\]/g, "").trim() + " | CV";

    var nav = app.appendChild(el("nav", "nav")); nav.setAttribute("aria-label", "Sections");
    var ni = nav.appendChild(el("div", "nav-inner"));
    var nn = ni.appendChild(el("a", "nav-name", d.name || "")); nn.href = "#top";
    var ul = ni.appendChild(el("ul"));
    Object.keys(NAV).forEach(function (k) { var a = ul.appendChild(el("li")).appendChild(el("a", "", NAV[k])); a.href = "#" + k; });

    var hero = app.appendChild(el("header", "hero")); hero.id = "top";
    var ht = hero.appendChild(el("div", "hero-text"));
    ht.appendChild(el("h1", "", d.name || ""));
    if (has(d.role)) ht.appendChild(el("p", "role", d.role));
    var cl = ht.appendChild(el("ul", "contact-line")); contactLinks(cl, d, true);
    var pf = ht.appendChild(el("figure", "portrait"));
    pf.appendChild(img(d.portrait, "Photo of " + (d.name || "me"), "Portrait photo"));
    var hf = hero.appendChild(el("figure", "hero-photo"));
    hf.appendChild(img(d.heroImage, d.heroCaption || "Field photo", "Feature photo"));
    if (has(d.heroCaption)) hf.appendChild(el("figcaption", "", d.heroCaption));

    var main = app.appendChild(el("main"));
    SECTIONS.forEach(function (s) {
      var key = s[0], title = s[1];
      var sec = el("section"); sec.id = key;
      sec.appendChild(el("h2", "", title));
      var c = sec.appendChild(el("div", "content"));
      var show = true;
      if (key === "about") { paras(c, d.about); if (has(d.objective)) { var p = c.appendChild(el("p")); p.appendChild(el("strong", "", "Objective: ")); rich(p, d.objective); } show = has(d.about) || has(d.objective); }
      else if (key === "education" || key === "experience" || key === "volunteer") { entries(c, d[key] || []); show = has(d[key]); }
      else if (key === "projects") {
        c.className = "content projects";
        (d.projects || []).forEach(function (pr) {
          var f = c.appendChild(el("figure"));
          if (pr.image) f.appendChild(img(pr.image, pr.title));
          else f.className = "no-photo";
          var cap = f.appendChild(el("figcaption"));
          if (has(pr.status)) cap.appendChild(el("em", "status", pr.status));
          cap.appendChild(el("strong", "", pr.title || ""));
          if (has(pr.text)) cap.appendChild(el("span", "", pr.text));
        });
        show = has(d.projects);
      }
      else if (key === "skills") {
        c.className = "content skills";
        (d.skills || []).forEach(function (sk) { var dv = c.appendChild(el("div")); dv.appendChild(el("h3", "", sk.heading || "")); dv.appendChild(el("p", "", sk.text || "")); });
        show = has(d.skills);
      }
      else if (key === "memberships" || key === "interests") { paras(c, d[key]); show = has(d[key]); }
      else if (key === "contact") {
        paras(c, d.contactNote);
        var p2 = c.appendChild(el("p")); contactLinks(p2, d, false);
        if (has(d.references)) c.appendChild(el("p", "", d.references));
      }
      if (show) main.appendChild(sec);
    });

    var ft = app.appendChild(el("footer"));
    ft.appendChild(el("span", "", (d.name || "") + (has(d.footerNote) ? " · " + d.footerNote : "")));
    if (has(d.updated)) ft.appendChild(el("span", "", "Last updated " + d.updated));
  }

  render(DATA);

        var im = new Image();

          cv.width = Math.round(im.naturalWidth * s); cv.height = Math.round(im.naturalHeight * s);
          cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL("image/jpeg", 0.8));
        };
        im.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  function buildHtml(d) {
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("app-js").textContent;
    var json = JSON.stringify(d).replace(/</g, "\\u003c");
    var title = String(d.name || "CV").replace(/\[[^\]]*\]/g, "").trim().replace(/&/g, "&amp;").replace(/</g, "&lt;");
    var S = "script", ST = "style";
    return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n" +
      "<title>" + title + " | CV</title>\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
      "<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap\" rel=\"stylesheet\">\n" +
      "<" + ST + " id=\"css\">" + css + "</" + ST + ">\n</head>\n<body>\n<div id=\"app\"></div>\n" +
      "<" + S + " type=\"application/json\" id=\"cv-data\">" + json + "</" + S + ">\n" +
      "<" + S + " id=\"app-js\">" + js + "</" + S + ">\n</body>\n</html>\n";
  }

  function startEditor(artifact, restored) {
    var draft = clone(restored || DATA);
    var fab = document.body.appendChild(el("button", "edit-fab", "Edit page"));
    fab.type = "button";
    var ed = document.body.appendChild(el("div", "editor"));
    ed.hidden = true; ed.setAttribute("role", "dialog"); ed.setAttribute("aria-label", "Edit CV");
    var bar = ed.appendChild(el("div", "ed-bar"));
    bar.appendChild(el("h2", "", "Edit your CV"));
    var status = bar.appendChild(el("span", "ed-status"));
    var cancel = bar.appendChild(el("button", "btn", "Cancel")); cancel.type = "button";
    var save = bar.appendChild(el("button", "btn primary", "Save & publish")); save.type = "button";
    var body = ed.appendChild(el("div", "ed-body"));

    function setStatus(t, err) { status.textContent = t || ""; status.className = "ed-status" + (err ? " err" : ""); }

    function field(parent, label, obj, key, multi, hint) {
      var lab = parent.appendChild(el("label", "field"));
      lab.appendChild(el("span")).textContent = label;
      var inp = document.createElement(multi ? "textarea" : "input");
      if (!multi) inp.type = "text";
      inp.value = obj[key] || "";
      if (hint) inp.placeholder = hint;
      function grow() { if (multi) { inp.style.height = "auto"; inp.style.height = (inp.scrollHeight + 2) + "px"; } }
      inp.addEventListener("input", function () { obj[key] = inp.value; grow(); });
      lab.appendChild(inp);
      requestAnimationFrame(grow);
      return inp;
    }
    function imageField(parent, label, obj, key, maxW) {
      var wrap = parent.appendChild(el("div", "img-field"));
      function thumb() {
        var t = wrap.querySelector("img, .thumb-empty"); if (t) t.remove();
        var n = obj[key] ? document.createElement("img") : el("div", "thumb-empty");
        if (obj[key]) { n.src = obj[key]; n.alt = ""; }
        wrap.insertBefore(n, wrap.firstChild);
      }
      thumb();
      var pick = wrap.appendChild(el("label", "btn file"));
      pick.appendChild(document.createTextNode(obj[key] ? "Replace " + label.toLowerCase() : "Add " + label.toLowerCase()));
      var fi = pick.appendChild(document.createElement("input"));
      fi.type = "file"; fi.accept = "image/*";
      fi.addEventListener("change", function () {
        var f = fi.files && fi.files[0]; if (!f) return;
        setStatus("Processing photo…");
        resizeImage(f, maxW).then(function (url) { obj[key] = url; thumb(); pick.firstChild.textContent = "Replace " + label.toLowerCase(); setStatus(""); })
          .catch(function () { setStatus("That file couldn't be read as an image. Try a JPEG or PNG.", true); });
        fi.value = "";
      });
      if (obj[key]) {
        var rm = wrap.appendChild(el("button", "btn danger", "Remove")); rm.type = "button";
        rm.addEventListener("click", function () { obj[key] = ""; thumb(); rm.remove(); pick.firstChild.textContent = "Add " + label.toLowerCase(); });
      }
    }
    function listEditor(title, hint, key, makeFields, blank, addLabel) {
      body.appendChild(el("h3", "", title));
      if (hint) body.appendChild(el("p", "ed-hint", hint));
      var holder = body.appendChild(el("div"));
      var add = body.appendChild(el("button", "btn", addLabel)); add.type = "button";
      draft[key] = draft[key] || [];
      function draw() {
        holder.textContent = "";
        draft[key].forEach(function (item, i) {
          var box = holder.appendChild(el("div", "item"));
          var tools = box.appendChild(el("div", "item-tools"));
          var up = tools.appendChild(el("button", "btn", "Move up")); up.type = "button"; up.disabled = i === 0;
          var dn = tools.appendChild(el("button", "btn", "Move down")); dn.type = "button"; dn.disabled = i === draft[key].length - 1;
          var rm = tools.appendChild(el("button", "btn danger", "Delete")); rm.type = "button";
          up.onclick = function () { var a = draft[key]; a.splice(i - 1, 0, a.splice(i, 1)[0]); draw(); };
          dn.onclick = function () { var a = draft[key]; a.splice(i + 1, 0, a.splice(i, 1)[0]); draw(); };
          rm.onclick = function () { if (rm.dataset.armed) { draft[key].splice(i, 1); draw(); } else { rm.dataset.armed = "1"; rm.textContent = "Tap again to delete"; setTimeout(function () { if (rm.isConnected) { delete rm.dataset.armed; rm.textContent = "Delete"; } }, 4000); } };
          makeFields(box, item);
        });
      }
      add.onclick = function () { draft[key].push(clone(blank)); draw(); var last = holder.lastElementChild; if (last) { var f = last.querySelector("input, textarea"); if (f) f.focus(); } };
      draw();
    }
    function entryFields(box, it) {
      field(box, "Title", it, "title");
      field(box, "Organization / place", it, "org");
      field(box, "Dates", it, "when", false, "e.g. May 2026 – Aug 2026");
      field(box, "Bullet points (one per line)", it, "bullets", true);
    }

    function build() {
      body.textContent = "";
      body.appendChild(el("p", "ed-hint", "Text in [square brackets] shows up highlighted in pink on the page, so you can spot anything you haven't filled in yet. Blank sections are hidden."));
      body.appendChild(el("h3", "", "Header"));
      field(body, "Name", draft, "name");
      field(body, "One-line intro", draft, "role", true);
      field(body, "Email", draft, "email");
      field(body, "Phone", draft, "phone");
      imageField(body, "Portrait photo", draft, "portrait", 1400);
      imageField(body, "Feature photo", draft, "heroImage", 1200);
      field(body, "Feature photo caption", draft, "heroCaption");

      body.appendChild(el("h3", "", "About"));
      field(body, "About you (leave a blank line between paragraphs)", draft, "about", true);
      field(body, "Objective", draft, "objective", true);

      listEditor("Education", "Most recent first. Include high school.", "education", entryFields, { title: "", org: "", when: "", bullets: "" }, "Add education");
      listEditor("Work experience", "Most recent first. Numbers help: sizes, counts, results.", "experience", entryFields, { title: "", org: "", when: "", bullets: "" }, "Add a job");
      listEditor("Projects", null, "projects", function (box, it) {
        field(box, "Project name", it, "title");
        field(box, "Status (optional)", it, "status", false, "In progress");
        field(box, "Short description", it, "text", true);
        imageField(box, "Photo", it, "image", 1000);
      }, { title: "", text: "", image: "" }, "Add a project");
      listEditor("Skills", "Group related skills under a heading.", "skills", function (box, it) {
        field(box, "Heading", it, "heading");
        field(box, "Skills", it, "text", true);
      }, { heading: "", text: "" }, "Add a skill group");
      listEditor("Volunteer experience", null, "volunteer", entryFields, { title: "", org: "", when: "", bullets: "" }, "Add volunteer experience");

      body.appendChild(el("h3", "", "More"));
      field(body, "Memberships", draft, "memberships", true);
      field(body, "Interests", draft, "interests", true);
      field(body, "Contact note", draft, "contactNote", true);
      field(body, "References line", draft, "references");
      field(body, "Footer note", draft, "footerNote");
    }

    function open() { build(); ed.hidden = false; fab.hidden = true; document.body.style.overflow = "hidden"; ed.scrollTop = 0; }
    function close() { ed.hidden = true; fab.hidden = false; document.body.style.overflow = ""; setStatus(""); }

    fab.onclick = function () { if (!restored) draft = clone(DATA); restored = null; open(); };
    cancel.onclick = function () { draft = clone(DATA); try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} close(); };
    save.onclick = function () {
      var out = clone(draft);
      out.rev = (DATA.rev || 0) + 1;
      out.updated = new Date().toLocaleDateString("en-CA", { month: "long", year: "numeric" });
      try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(out)); } catch (e) {}
      save.disabled = true; cancel.disabled = true; setStatus("Publishing…");
      artifact.publish(buildHtml(out)).then(function () {
        setStatus("Published. Reloading…");
      }).catch(function (err) {
        save.disabled = false; cancel.disabled = false;
        var code = err && err.code;
        if (code === "conflict") setStatus("A newer version was saved elsewhere. The page is reloading; your edits will be offered again.", true);
        else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled") {
          setStatus("This view is read-only, so changes can't be published here.", true);
        }
        else if (code === "too_large") setStatus("The page is too large to save. Try removing or replacing a photo.", true);
        else if (code === "rate_limited") setStatus("Saving too often. Wait a minute, then save again.", true);
        else setStatus("Couldn't publish just now. Your edits are still here; try Save again.", true);
      });
    };

    if (restored) { open(); setStatus("Your last save didn't finish. Review your edits and save again.", true); }
  }

  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
      var artifact = r[0], user = r[1];
      if (!artifact || !user) return;
      return user.canEdit().then(function (ok) {
        if (!ok) return;
        var restored = null;
        try {
          var s = sessionStorage.getItem(DRAFT_KEY);
          if (s) { var dr = JSON.parse(s); if ((dr.rev || 0) > (DATA.rev || 0)) restored = dr; else sessionStorage.removeItem(DRAFT_KEY); }
        } catch (e) {}
        startEditor(artifact, restored);
      });
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
